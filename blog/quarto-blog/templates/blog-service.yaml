apiVersion: v1
kind: Service
metadata:
  name: quarto-blog-service
spec:
  selector:
    app: quarto-deployment
  ports:
    {{- toYaml .Values.service.ports | nindent 4 }}
  type: {{ .Values.service.type }}
  
  {{- if .Values.service.ipAddress }}
  loadBalancerIP: {{ .Values.service.ipAddress }}
  {{- end }}

